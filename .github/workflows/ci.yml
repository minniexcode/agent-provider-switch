name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing leg must not cancel the others. A Windows-only failure and a Linux-only
      # failure are different defects, and seeing both in one run saves a round trip.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `prepare` is `npm run build`, so a type or compile error surfaces here, at install time,
      # which is the more legible failure. The cost is that the build runs twice per leg, since
      # `npm test` is `npm run build && node tests/run-tests.js`. Accepted. This step also has to
      # keep installing devDependencies, because `typescript` is one of them.
      #
      # Deliberately no `engine-strict`. `package.json` advertises `engines.node: ">=18"`, which
      # this matrix never exercises; enforcing it would promote that pre-existing mismatch into a
      # hard install failure on the advertised floor instead of leaving it as the separate,
      # tracked problem it is.
      - run: npm ci

      - run: npx tsc --noEmit

      # Both legs earn their place, and they do not cover the same code. `secret-handling.spec.js`
      # returns early on win32 for its `0600`/`0700` assertions, because `writeTextFileAtomic()`
      # skips `chmod` on Windows and access is governed by NTFS ACLs there. The ubuntu leg is
      # therefore the only place that POSIX permission path executes at all.
      - run: npm test

      # A separate step, not part of `npm test`, because it costs a process spawn and a build per
      # case and would slow the fast suite down for everyone. It is not merely slower though: it
      # runs the built binary as a real child process with real pipes, which is the coverage the
      # in-process suite structurally cannot provide — exit codes, stdout truncation, env
      # isolation. `tests/e2e/` sits outside the main runner's discovery for the same reason.
      #
      # No environment-dependent skips are needed: `migrate`'s happy path needs a TTY, and
      # `doctor`'s runtime probe is pinned at both ends — a stand-in `codex` on a sandboxed PATH for
      # the found branch, an emptied PATH for the missing one — so neither depends on whether the
      # runner has the CLI. (The found branch used to run on the ambient PATH, which is why this
      # step passed on a developer machine with codex installed and failed on every runner.) The
      # runner still prints a skip count, unlike `run-tests.js`,
      # because a silently skipped case here would hide exactly what this suite exists to expose.
      - run: npm run test:e2e
